name: Build Cross-Platform Suite (Win, Android, Mac, iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS DESKTOP (.EXE)
  # =========================================================================
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop & Scaffolding
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
      - run: flutter pub get
      - name: Compile Windows
        run: flutter build windows --release
      - name: Package Zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath billing_app_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-windows-x64
          path: billing_app_windows.zip
          retention-days: 7

  # =========================================================================
  # 2. BUILD ANDROID MOBILE (.APK)
  # =========================================================================
  build-android:
    name: Build Android Release (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android Scaffolding & Configure CompileSdk
        run: |
          flutter create --platforms=android .
          bash scripts/patch_android.sh
      - run: flutter pub get
      - name: Compile Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # =========================================================================
  # 3. BUILD MACOS DESKTOP (.APP)
  # =========================================================================
  build-macos:
    name: Build macOS Release (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable macOS Desktop & Scaffolding
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .
      - run: flutter pub get
      - name: Compile macOS Desktop
        run: flutter build macos --release
      - name: Package macOS Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app billing_app_macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-macos
          path: billing_app_macos.zip
          retention-days: 7

  # =========================================================================
  # 4. BUILD IOS MOBILE (.IPA / RUNNER)
  # =========================================================================
  build-ios:
    name: Build iOS (Simulator / Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate iOS Scaffolding
        run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Compile iOS
        env:
          IOS_DEV_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$IOS_DEV_TEAM" ]; then
            echo "Building iOS Release for device with Development Team..."
            flutter build ios --release --no-codesign
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app billing_app_ios_unsigned.zip
          else
            echo "No Development Team secret found; compiling iOS Simulator build (no codesigning required)..."
            flutter build ios --simulator
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app billing_app_ios_unsigned.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-ios
          path: billing_app_ios_unsigned.zip
          retention-days: 7