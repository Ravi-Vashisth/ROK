name: Build Desktop & Mobile Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually click "Run workflow"

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS .EXE
  # =========================================================================
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # THIS STEP CREATES THE MISSING WINDOWS FOLDER AUTOMATICALLY
      - name: Generate Windows Scaffolding
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release as Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath billing_app_windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-windows-x64
          path: billing_app_windows.zip
          retention-days: 7

  # =========================================================================
  # 2. BUILD ANDROID .APK
  # =========================================================================
  build-android:
    name: Build Android Release (.apk)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # THIS STEP CREATES THE MISSING ANDROID FOLDER AUTOMATICALLY
      - name: Generate Android Scaffolding
        run: flutter create --platforms=android .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7