name: Build Desktop & Mobile Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually click "Run" anytime

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS .EXE
  # =========================================================================
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release as Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath billing_app_windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-windows-x64
          path: billing_app_windows.zip
          retention-days: 7

  # =========================================================================
  # 2. BUILD ANDROID .APK (Bonus: Test on your phone too)
  # =========================================================================
  build-android:
    name: Build Android Release (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7