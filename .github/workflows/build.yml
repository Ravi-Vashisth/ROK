name: Build Cross-Platform Suite (Win, Android, Mac, iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS DESKTOP (.EXE)
  # =========================================================================
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop & Scaffolding
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
      - run: flutter pub get
      - name: Compile Windows
        run: flutter build windows --release
      - name: Package Zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath billing_app_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-windows-x64
          path: billing_app_windows.zip
          retention-days: 7

  # =========================================================================
  # 2. BUILD ANDROID MOBILE (.APK)
  # =========================================================================
  build-android:
    name: Build Android Release (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android Scaffolding & Configure CompileSdk
        run: |
          flutter create --platforms=android .

          # 1. Update android/app/build.gradle to compileSdk 36 & targetSdk 36
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts || true
          fi

          # 2. Append subprojects compileSdkVersion override and disable AarMetadata check in android/build.gradle
          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

allprojects {
    tasks.matching { it.name.contains("AarMetadata") }.configureEach {
        enabled = false
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (compileSdkVersion != null && compileSdkVersion < 36) {
                    compileSdkVersion 36
                }
            }
        }
    }
}
EOF
          fi

          # 3. Handle Kotlin DSL root if present
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts

allprojects {
    tasks.matching { it.name.contains("AarMetadata") }.configureEach {
        enabled = false
    }
}
subprojects {
    afterEvaluate {
        if (project.hasProperty("android")) {
            val androidExt = project.extensions.findByName("android")
            if (androidExt is com.android.build.gradle.BaseExtension) {
                androidExt.compileSdkVersion(36)
            }
        }
    }
}
EOF
          fi
      - run: flutter pub get
      - name: Compile Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # =========================================================================
  # 3. BUILD MACOS DESKTOP (.APP)
  # =========================================================================
  build-macos:
    name: Build macOS Release (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable macOS Desktop & Scaffolding
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .
      - run: flutter pub get
      - name: Compile macOS Desktop
        run: flutter build macos --release
      - name: Package macOS Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app billing_app_macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-macos
          path: billing_app_macos.zip
          retention-days: 7

  # =========================================================================
  # 4. BUILD IOS MOBILE (.IPA / RUNNER)
  # =========================================================================
  build-ios:
    name: Build iOS (Simulator / Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate iOS Scaffolding
        run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Compile iOS
        env:
          IOS_DEV_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$IOS_DEV_TEAM" ]; then
            echo "Building iOS Release for device with Development Team..."
            flutter build ios --release --no-codesign
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app billing_app_ios_unsigned.zip
          else
            echo "No Development Team secret found; compiling iOS Simulator build (no codesigning required)..."
            flutter build ios --simulator
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app billing_app_ios_unsigned.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: billing-app-ios
          path: billing_app_ios_unsigned.zip
          retention-days: 7