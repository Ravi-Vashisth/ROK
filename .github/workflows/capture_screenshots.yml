name: Multi-Platform Visual Screenshot Capture

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  capture-macos-and-ios:
    name: Capture macOS Desktop & iOS Simulator Screenshots
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS Desktop & Create Native Projects
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos,ios .
          flutter pub get

      - name: Capture macOS Desktop Screenshots
        env:
          SCREENSHOT_PLATFORM: macos
        run: |
          mkdir -p screenshots/macos
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_tour_test.dart -d macos || true

      - name: Boot iOS Simulator & Capture Screenshots
        env:
          SCREENSHOT_PLATFORM: ios
        run: |
          mkdir -p screenshots/ios
          SIM_UUID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting iOS Simulator UUID: $SIM_UUID"
          xcrun simctl boot "$SIM_UUID" || true
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_tour_test.dart -d "$SIM_UUID" || true
          if [ ! -f screenshots/ios/01_dashboard.png ]; then
            xcrun simctl io "$SIM_UUID" screenshot screenshots/ios/01_dashboard.png || true
          fi

      - name: Upload macOS & iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-ios
          path: screenshots/
          if-no-files-found: ignore

  capture-windows:
    name: Capture Windows Desktop Screenshots
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop & Create Native Project
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get

      - name: Capture Windows Desktop Screenshots
        shell: powershell
        env:
          SCREENSHOT_PLATFORM: windows
        run: |
          New-Item -ItemType Directory -Force -Path screenshots/windows
          $ErrorActionPreference = 'Continue'
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_tour_test.dart -d windows
          exit 0

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore

  capture-android:
    name: Capture Android Emulator Screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Native Android Project & Apply Gradle Patches
        run: |
          flutter create --platforms=android .
          bash scripts/patch_android.sh
          flutter pub get

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            mkdir -p screenshots/android
            adb wait-for-device
            sleep 5
            flutter devices
            export SCREENSHOT_PLATFORM=android
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_tour_test.dart -d emulator-5554 || true
            if [ ! -f screenshots/android/01_dashboard.png ]; then
              adb exec-out screencapture -p > screenshots/android/01_dashboard.png || true
            fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: screenshots/
          if-no-files-found: ignore

  aggregate-screenshots:
    name: Aggregate All Platform Screenshots
    if: always()
    needs: [capture-macos-and-ios, capture-windows, capture-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all screenshot artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined_screenshots

      - name: Create Clean Aggregated Screenshot Archive
        run: |
          mkdir -p all-platforms-screenshots/android all-platforms-screenshots/ios all-platforms-screenshots/macos all-platforms-screenshots/windows
          if [ -d combined_screenshots ]; then
            find combined_screenshots -type f -name "*.png" | while read -r img; do
              filename=$(basename "$img")
              if [[ "$img" == *"/android/"* ]]; then
                cp -f "$img" "all-platforms-screenshots/android/$filename"
              elif [[ "$img" == *"/ios/"* ]]; then
                cp -f "$img" "all-platforms-screenshots/ios/$filename"
              elif [[ "$img" == *"/macos/"* ]]; then
                cp -f "$img" "all-platforms-screenshots/macos/$filename"
              elif [[ "$img" == *"/windows/"* ]]; then
                cp -f "$img" "all-platforms-screenshots/windows/$filename"
              else
                platform=$(basename $(dirname "$img"))
                mkdir -p "all-platforms-screenshots/$platform"
                cp -f "$img" "all-platforms-screenshots/$platform/$filename"
              fi
            done
          fi
          zip -r all-platforms-screenshots.zip all-platforms-screenshots/

      - name: Upload Aggregated Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms-screenshots
          path: all-platforms-screenshots.zip
